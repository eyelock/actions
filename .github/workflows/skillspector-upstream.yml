name: SkillSpector upstream

# NVIDIA releases SkillSpector often. When a release is newer than the pinned
# one, open a pull request that bumps the pin and adds a minor changeset: new
# rules can fail builds that passed before, so a person reviews the new
# findings before the action ships it. Bump pull requests for older releases
# are closed as superseded.
#
# The pull request is opened as the eyelock-actions-bot GitHub App, not with
# GITHUB_TOKEN: a pull request opened with GITHUB_TOKEN does not trigger CI.
# The app's client ID is the BOT_CLIENT_ID variable and its key the
# BOT_PRIVATE_KEY secret.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Everything that writes uses the app's token.
permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          token: ${{ steps.bot.outputs.token }}

      - name: Bump the pin if upstream has a newer release
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT: ${{ steps.bot.outputs.app-slug }}[bot]
        run: |
          dockerfile=skillspector/Dockerfile
          current="$(sed -n 's/^ARG SKILLSPECTOR_VERSION=//p' "$dockerfile" | head -1)"
          latest="$(gh api repos/NVIDIA/SkillSpector/releases/latest --jq .tag_name)"
          echo "pinned $current, upstream $latest"
          if [[ "$current" == "$latest" ]]; then
            exit 0
          fi

          branch="chore/skillspector-$latest"
          commit="$(gh api "repos/NVIDIA/SkillSpector/commits/$latest" --jq .sha)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            # A pull request that was opened and closed is a decision; leave it.
            # A branch with none means an earlier run pushed but could not open one.
            if [[ "$(gh pr list --head "$branch" --state all --json number --jq length)" != 0 ]]; then
              echo "$branch already has a pull request"
              exit 0
            fi
            echo "$branch has no pull request, opening one"
          else
            sed -i \
              -e "s/^ARG SKILLSPECTOR_VERSION=.*/ARG SKILLSPECTOR_VERSION=$latest/" \
              -e "s/^ARG SKILLSPECTOR_COMMIT=.*/ARG SKILLSPECTOR_COMMIT=$commit/" \
              "$dockerfile"
            printf -- '---\n"skillspector": minor\n---\n\nSkillSpector %s (was %s). New rules can report findings that %s did not.\n' \
              "$latest" "$current" "$current" > ".changeset/skillspector-$latest.md"

            bot_id="$(gh api "users/$BOT" --jq .id)"
            git config user.name "$BOT"
            git config user.email "$bot_id+$BOT@users.noreply.github.com"
            git switch -c "$branch"
            git add "$dockerfile" .changeset
            git commit -m "chore(skillspector): bump SkillSpector to $latest"
            git push origin "$branch"
          fi
          url="$(gh pr create --base develop --head "$branch" \
            --title "chore(skillspector): bump SkillSpector to $latest" \
            --body "Upstream release: https://github.com/NVIDIA/SkillSpector/releases/tag/$latest

          Pinned to commit \`$commit\`. Before merging, run the new image over the repositories that use this action and triage any new findings.")"

          # Older bump pull requests still open are replaced by this one.
          gh pr list --base develop --state open --json number,headRefName \
            | jq -r --arg branch "$branch" \
                '.[] | select(.headRefName | startswith("chore/skillspector-")) | select(.headRefName != $branch) | .number' \
            | while read -r number; do
                echo "closing #$number, superseded by $url"
                gh pr close "$number" --delete-branch --comment "Superseded by $url."
              done
