name: Version

# Pending changesets on develop open (or update) a "chore: version actions"
# pull request into develop. Merging it bumps only the actions that changed;
# the next release PR from develop to main then publishes them.
#
# Versioning happens here, not on main, because main only accepts pull
# requests from develop, release/* or hotfix/*.
#
# The pull request is opened as the eyelock-actions-bot GitHub App, not with
# GITHUB_TOKEN: a pull request opened with GITHUB_TOKEN does not trigger CI,
# so All Clear would never report on it. The app's client ID is the
# BOT_CLIENT_ID variable and its key the BOT_PRIVATE_KEY secret.

on:
  push:
    branches: [develop]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Everything that writes uses the app's token.
permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Open or update the version pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm changeset:version
          commit: "chore: version actions"
          title: "chore: version actions"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token }}
