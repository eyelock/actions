name: Version

# Pending changesets on develop open (or update) a "chore: version actions"
# pull request into develop. Merging it bumps only the actions that changed;
# the next release PR from develop to main then publishes them.
#
# Versioning happens here, not on main, because main only accepts pull
# requests from develop, release/* or hotfix/*.
#
# A pull request opened with GITHUB_TOKEN does not trigger CI, so All Clear
# never reports on it: merge it with the admin bypass, or set the
# UPSTREAM_PR_TOKEN secret (contents and pull requests write).

on:
  push:
    branches: [develop]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_PR_TOKEN || github.token }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Open or update the version pull request
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset:version
          commit: "chore: version actions"
          title: "chore: version actions"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN || github.token }}
