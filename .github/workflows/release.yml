name: Release

# Each action releases on its own. Pending changesets open a "Version Packages"
# pull request; merging it bumps only the actions that changed. A version with
# no tag yet then has its image published first and its tags pushed last, so a
# tag never points at an image that does not exist.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pending: ${{ steps.changesets.outputs.hasChangesets }}
      releases: ${{ steps.plan.outputs.releases }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Open or update the version pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm changeset:version
          commit: "chore: version actions"
          title: "chore: version actions"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan releases
        id: plan
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/release-plan.mjs

  image:
    name: Image ${{ matrix.release.action }} ${{ matrix.arch }}
    needs: version
    if: needs.version.outputs.any == 'true'
    strategy:
      matrix:
        release: ${{ fromJSON(needs.version.outputs.releases) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.release.image

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: matrix.release.image

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: matrix.release.image
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: matrix.release.image
        with:
          context: ${{ matrix.release.action }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/eyelock/${{ matrix.release.action }}:${{ matrix.release.version }}-${{ matrix.arch }}

  publish:
    name: Publish ${{ matrix.release.action }}
    needs: [version, image]
    if: needs.version.outputs.any == 'true'
    strategy:
      matrix:
        release: ${{ fromJSON(needs.version.outputs.releases) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: matrix.release.image
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: matrix.release.image

      - name: Multi-arch image tags
        if: matrix.release.image
        env:
          IMAGE: ghcr.io/eyelock/${{ matrix.release.action }}
          VERSION: ${{ matrix.release.version }}
          MAJOR: ${{ matrix.release.major }}
        run: |
          for tag in "$VERSION" "$MAJOR"; do
            docker buildx imagetools create -t "$IMAGE:$tag" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          done

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION: ${{ matrix.release.action }}
          VERSION: ${{ matrix.release.version }}
          TAG: ${{ matrix.release.tag }}
          MAJOR_TAG: ${{ matrix.release.majorTag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$ACTION $VERSION"
          git tag -f "$MAJOR_TAG" "$TAG^{}"
          git push origin "$TAG"
          git push --force origin "$MAJOR_TAG"

          # This version's section of the changelog, without its heading.
          notes="$(awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' "$ACTION/CHANGELOG.md" 2>/dev/null || true)"
          gh release create "$TAG" --title "$ACTION $VERSION" --notes "${notes:-Release $ACTION $VERSION.}"
