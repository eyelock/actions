version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/skillspector"]
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # The Python base image digest. SkillSpector itself is bumped by
  # .github/workflows/skillspector-upstream.yml.
  - package-ecosystem: docker
    directory: /skillspector
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    # Patch releases and digests only. A new Python minor needs wheels for
    # SkillSpector's native dependencies (yara-python had none for 3.14), so
    # move it by hand once they exist.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
